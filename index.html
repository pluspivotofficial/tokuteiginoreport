<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特定技能 定期面談報告書｜施設別レポート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3864;
    --navy-soft:#3a517f;
    --ink:#21262e;
    --ink-mute:#5b6573;
    --line:#dfe3ea;
    --line-soft:#eceff4;
    --paper:#f6f7f9;
    --white:#ffffff;
    --ok:#3f7a6d;        /* 問題なし：落ち着いた緑青 */
    --ok-bg:#eaf2ef;
    --warn:#b5740c;      /* 問題あり：琥珀 */
    --warn-bg:#fbf2e2;
    --bad:#b42318;       /* 法令違反：赤 */
    --bad-bg:#fbeae8;
    --shadow:0 1px 2px rgba(31,56,100,.06),0 8px 24px rgba(31,56,100,.06);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;
    color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;line-height:1.7;
  }
  /* ---------- ヘッダ ---------- */
  header.masthead{
    background:var(--navy);color:#eef2f9;
    padding:26px clamp(18px,4vw,48px) 22px;
    border-bottom:3px solid #14233f;
  }
  .masthead .eyebrow{
    font-size:11px;letter-spacing:.28em;color:#aebcd6;
    text-transform:uppercase;font-weight:500;margin:0 0 8px;
  }
  .masthead h1{
    font-family:"Noto Serif JP",serif;font-weight:600;
    font-size:clamp(20px,3.4vw,30px);margin:0;letter-spacing:.04em;
  }
  .masthead .sub{color:#c5d0e6;font-size:13px;margin-top:6px;}
  .masthead .formref{
    display:inline-block;margin-top:14px;font-size:11.5px;color:#aebcd6;
    border:1px solid #3a4f78;border-radius:4px;padding:3px 9px;letter-spacing:.05em;
  }
 
  /* ---------- サマリーバー ---------- */
  .summary{
    max-width:1180px;margin:-18px auto 0;padding:0 clamp(14px,3vw,28px);
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;
  }
  .stat{
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    padding:14px 16px;box-shadow:var(--shadow);
  }
  .stat .label{font-size:11.5px;color:var(--ink-mute);letter-spacing:.04em;}
  .stat .num{font-family:"Noto Serif JP",serif;font-weight:700;font-size:28px;line-height:1.1;margin-top:2px;}
  .stat.t-bad .num{color:var(--bad);}
  .stat.t-warn .num{color:var(--warn);}
  .stat .num small{font-size:13px;font-weight:500;color:var(--ink-mute);font-family:"Noto Sans JP";}
 
  /* ---------- 本体 ---------- */
  main{max-width:1180px;margin:0 auto;padding:26px clamp(14px,3vw,28px) 60px;}
 
  .toolbar{
    display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:18px 0 14px;
  }
  .toolbar .filters{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-btn{
    border:1px solid var(--line);background:var(--white);color:var(--ink-mute);
    font-family:inherit;font-size:12.5px;border-radius:999px;padding:6px 13px;cursor:pointer;
    transition:.15s;
  }
  .chip-btn:hover{border-color:var(--navy-soft);color:var(--navy);}
  .chip-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .toolbar .hint{margin-left:auto;font-size:11.5px;color:var(--ink-mute);}
 
  /* ---------- 施設カード ---------- */
  .facility{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    margin-bottom:16px;box-shadow:var(--shadow);overflow:hidden;
  }
  .fac-head{
    display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;
    padding:16px 18px;cursor:pointer;border-left:5px solid var(--navy);
  }
  .fac-head:hover{background:#fafbfd;}
  .fac-title-wrap{min-width:0;}
  .fac-name{font-family:"Noto Serif JP",serif;font-weight:600;font-size:17px;color:var(--navy);}
  .fac-meta{font-size:12px;color:var(--ink-mute);margin-top:3px;}
  .fac-right{display:flex;align-items:center;gap:16px;}
  .fac-counts{display:flex;gap:14px;text-align:center;}
  .fac-counts .c{font-size:11px;color:var(--ink-mute);line-height:1.3;}
  .fac-counts .c b{display:block;font-family:"Noto Serif JP",serif;font-size:19px;color:var(--ink);}
  .fac-counts .c.bad b{color:var(--bad);}
  .fac-counts .c.warn b{color:var(--warn);}
  .toggle{
    width:26px;height:26px;border-radius:50%;border:1px solid var(--line);
    display:grid;place-items:center;color:var(--navy);font-size:13px;transition:.2s;flex:none;
  }
  .facility.open .toggle{transform:rotate(180deg);background:var(--navy);color:#fff;border-color:var(--navy);}
 
  /* 健康ストリップ（シグネチャー） */
  .strip{display:flex;height:6px;width:100%;}
  .strip span{flex:1;min-width:3px;}
  .strip span.s-ok{background:var(--ok);}
  .strip span.s-warn{background:var(--warn);}
  .strip span.s-bad{background:var(--bad);}
 
  /* ---------- 対象者テーブル ---------- */
  .fac-body{display:none;border-top:1px solid var(--line-soft);}
  .facility.open .fac-body{display:block;}
  table.workers{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.workers thead th{
    text-align:left;font-weight:500;font-size:11.5px;color:var(--ink-mute);
    letter-spacing:.04em;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfd;
  }
  table.workers tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  table.workers tbody tr:last-child td{border-bottom:none;}
  table.workers tbody tr{cursor:pointer;transition:.12s;}
  table.workers tbody tr:hover{background:#f7f9fc;}
  .w-name{font-weight:500;}
  .w-name .nat{font-size:11px;color:var(--ink-mute);font-weight:400;margin-left:6px;}
  .col-c{text-align:center;}
  .view-link{color:var(--navy);font-size:12px;font-weight:500;white-space:nowrap;}
 
  .badge{
    display:inline-block;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px;
    letter-spacing:.02em;white-space:nowrap;
  }
  .badge.ok{background:var(--ok-bg);color:var(--ok);}
  .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.bad{background:var(--bad-bg);color:var(--bad);}
  .dash{color:#c3cad6;}
 
  /* ---------- モーダル（面談票詳細） ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,30,52,.55);backdrop-filter:blur(2px);
    display:none;z-index:50;padding:20px;overflow-y:auto;
  }
  .overlay.show{display:block;}
  .modal{
    background:var(--white);max-width:840px;margin:24px auto;border-radius:12px;
    box-shadow:0 20px 60px rgba(10,20,40,.35);overflow:hidden;
  }
  .modal-head{
    background:var(--navy);color:#eef2f9;padding:16px 22px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:14px;
  }
  .modal-head .mh-form{font-size:11px;color:#aebcd6;letter-spacing:.18em;}
  .modal-head .mh-title{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:600;margin-top:2px;}
  .modal-head .mh-sub{font-size:12px;color:#c5d0e6;margin-top:4px;}
  .closex{background:none;border:1px solid #46598000;color:#cdd8ec;font-size:24px;cursor:pointer;line-height:1;padding:2px 8px;border-radius:6px;}
  .closex:hover{background:rgba(255,255,255,.12);}
  .modal-body{padding:20px 22px 26px;max-height:none;}
 
  .sec-label{
    font-family:"Noto Serif JP",serif;font-weight:600;color:var(--navy);font-size:14px;
    margin:22px 0 9px;padding-bottom:6px;border-bottom:2px solid var(--navy);
    display:flex;align-items:center;gap:8px;
  }
  .sec-label:first-child{margin-top:0;}
  .sec-num{background:var(--navy);color:#fff;font-size:11px;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;font-family:"Noto Sans JP";}
 
  .kv{display:grid;grid-template-columns:140px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px;}
  .kv .k{background:#f4f6fa;padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-mute);font-size:12px;}
  .kv .v{padding:9px 12px;border-bottom:1px solid var(--line-soft);}
  .kv .k:last-of-type,.kv .v:last-of-type{border-bottom:none;}
 
  table.result{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  table.result th{background:#f4f6fa;color:var(--ink-mute);font-weight:500;font-size:11px;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);}
  table.result td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  table.result tr:last-child td{border-bottom:none;}
  .cat-cell{font-weight:500;color:var(--navy);white-space:nowrap;background:#fbfcfe;border-right:1px solid var(--line-soft);}
  .yn{font-weight:700;text-align:center;white-space:nowrap;}
  .yn.has{color:var(--bad);}
  .yn.no{color:var(--ok);}
  .pnote{color:var(--bad);font-size:12px;}
 
  .violation{border:1px solid var(--bad);border-radius:8px;overflow:hidden;}
  .violation .vh{background:var(--bad-bg);color:var(--bad);font-weight:600;font-size:12.5px;padding:8px 12px;border-bottom:1px solid #f0cfca;}
  .violation .vbody{padding:6px 0;}
  .vrow{display:grid;grid-template-columns:150px 1fr;gap:0;font-size:12.5px;border-bottom:1px solid var(--line-soft);}
  .vrow:last-child{border-bottom:none;}
  .vrow .vk{padding:9px 12px;color:var(--ink-mute);background:#fcf6f5;font-size:12px;}
  .vrow .vv{padding:9px 12px;}
  .vv ul{margin:0;padding-left:18px;}
  .vv .done{color:var(--ok);font-weight:600;}
  .modal-foot{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--ink-mute);margin-top:18px;padding-top:12px;border-top:1px solid var(--line);}
 
  .empty{padding:40px;text-align:center;color:var(--ink-mute);font-size:13px;}
 
  footer.note{max-width:1180px;margin:0 auto;padding:0 clamp(14px,3vw,28px) 50px;color:var(--ink-mute);font-size:11.5px;}
  footer.note .demo{background:#fff6e6;border:1px solid #f0dca8;color:#8a6418;border-radius:8px;padding:10px 14px;}
 
  @media (max-width:720px){
    .summary{grid-template-columns:1fr 1fr;}
    .fac-head{grid-template-columns:1fr;}
    .fac-right{justify-content:space-between;}
    table.workers thead{display:none;}
    table.workers tbody td{display:block;padding:4px 14px;border:none;}
    table.workers tbody tr{display:block;padding:10px 0;border-bottom:1px solid var(--line-soft);}
    table.workers tbody td.col-c{text-align:left;}
    td[data-l]::before{content:attr(data-l);font-size:11px;color:var(--ink-mute);margin-right:8px;}
    .kv,.vrow{grid-template-columns:1fr;}
    .kv .k{border-bottom:none;}
  }
  *:focus-visible{outline:2px solid var(--navy-soft);outline-offset:2px;border-radius:4px;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto;}}
</style>
</head>
<body>
 
<header class="masthead">
  <p class="eyebrow">特定技能 受入支援 ｜ コンプライアンス</p>
  <h1>定期面談報告書 — 施設別レポート</h1>
  <p class="sub">1号特定技能外国人用・対象者の面談記録を施設ごとに集約して確認できます</p>
  <span class="formref">参考様式第5-5号 準拠</span>
</header>
 
<section class="summary" id="summary"></section>
 
<main>
  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="chip-btn active" data-f="all">すべての施設</button>
      <button class="chip-btn" data-f="bad">法令違反あり</button>
      <button class="chip-btn" data-f="warn">問題あり</button>
    </div>
    <span class="hint">施設名をタップで対象者一覧 ／ 対象者の行をタップで面談票を表示</span>
  </div>
  <div id="facilities"></div>
</main>
 
<footer class="note">
  <p class="demo">これはサンプルデータで構成した初回版です。<b>TURNER ELIZABETH さん（株式会社 入管／居住費控除の法令違反ケース）はアップロード書類の実データ</b>を反映しています。その他の施設・対象者は構成確認用のダミーです。実データの取り込み方法（CSV／面談票PDF／フォーム入力など）は次のステップで設計しましょう。</p>
</footer>
 
<!-- モーダル -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="modal" id="modal"></div>
</div>
 
<script>
/* ============ 面談事項の標準テンプレート（様式第5-5号 3.面談結果） ============ */
const ITEMS = [
  {cat:"①業務内容", list:[
    "雇用契約と異なる業務に従事していないこと",
    "他の事業主の下で業務に従事していないこと",
    "安全衛生に配慮して適切に業務を行っていること",
  ]},
  {cat:"②待遇", list:[
    "雇用契約に基づき毎月適切に報酬を受け取っていること",
    "雇用契約と異なる労働時間となっていないこと",
    "休日，休暇等が適切に付与されていること（一時帰国休暇を含む）",
    "適切な住居が確保されていること",
    "定期的に負担する食費，居住費等が合意したとおりの内容であること",
    "支援計画にのっとった支援の提供を受けていること",
  ]},
  {cat:"③保護", list:[
    "暴行・脅迫・監禁等の不法行為を受けていないこと",
    "保証金の徴収・違約金を定める契約等がないこと",
    "預金通帳の管理など不当な財産管理を受けていないこと",
    "旅券・在留カードを自分で保管していること",
    "私生活上の自由を不当に制限されていないこと",
  ]},
  {cat:"④生活", list:[
    "日常生活においてトラブルが発生していないこと",
    "健康状態に異常がないこと",
  ]},
  {cat:"⑤その他", list:[
    "不法就労者が働いていないこと",
    "その他",
  ]},
];
 
/* problems: "カテゴリindex-項目index": "問題の内容" で 有 を指定 */
function worker(o){return Object.assign({nat:"",problems:{},violation:null,respondent:"法務 花子",role:"支援担当者（主任）",madeOn:""},o);}
 
/* ============ データ（施設 → 対象者） ============ */
const DATA = [
  {
    id:"f1", name:"特別養護老人ホーム さくら苑", area:"神奈川県横浜市", org:"株式会社 入管",
    workers:[
      worker({id:"w1", name:"TURNER ELIZABETH", nat:"英国", date:"2021/2/15",
        problems:{"1-4":"特定技能外国人との合意なしに居住費が5,000円から18,000円に変更された。"},
        violation:{
          occurred:"2021年2月7日",
          detail:"特定技能所属機関が，居住費の控除額を特定技能外国人との合意なしに5,000円から18,000円に変更した。元の控除額に戻すよう依頼したが，本届出書作成日時点において改善されていない。また，特定技能外国人には労働基準監督署を案内し相談するため同行した。",
          a:["労働基準監督署等の関係行政機関を案内（案内した機関：労働基準監督署）"],
          iNotice:{done:true, date:"2021年2月10日", to:"代表取締役・入管太郎"},
          iImmig:"案内済み",
          c:{reported:true, date:"2021年2月10日", office:"東京出入国在留管理局"},
        },
        madeOn:"2021年4月1日"}),
      worker({id:"w2", name:"NGUYEN THI HOA", nat:"ベトナム", date:"2026/4/12"}),
      worker({id:"w3", name:"DELA CRUZ MARIA", nat:"フィリピン", date:"2026/4/12"}),
      worker({id:"w4", name:"PUTRI ANDINI", nat:"インドネシア", date:"2026/4/13",
        problems:{"3-0":"近隣住民とのゴミ出しルールで軽微なトラブル。生活支援員が仲介し解決済み。"}}),
      worker({id:"w5", name:"WIN HTET AUNG", nat:"ミャンマー", date:"2026/4/13"}),
      worker({id:"w6", name:"KHAING ZIN OO", nat:"ミャンマー", date:"2026/4/14"}),
      worker({id:"w7", name:"TRAN VAN MINH", nat:"ベトナム", date:"2026/4/14"}),
      worker({id:"w8", name:"SANTOS JOHN PAUL", nat:"フィリピン", date:"2026/4/15"}),
    ]
  },
  {
    id:"f2", name:"介護老人保健施設 ひだまり", area:"愛知県名古屋市", org:"株式会社 入管",
    workers:[
      worker({id:"w9", name:"PHAM THU HA", nat:"ベトナム", date:"2026/5/8"}),
      worker({id:"w10", name:"REYES ANGEL", nat:"フィリピン", date:"2026/5/8"}),
      worker({id:"w11", name:"SARI DEWI", nat:"インドネシア", date:"2026/5/9"}),
      worker({id:"w12", name:"AYE CHAN MOE", nat:"ミャンマー", date:"2026/5/9"}),
    ]
  },
  {
    id:"f3", name:"グループホーム 結の家", area:"福岡県福岡市", org:"株式会社 入管",
    workers:[
      worker({id:"w13", name:"LE THI MAI", nat:"ベトナム", date:"2026/5/20"}),
      worker({id:"w14", name:"BAUTISTA GRACE", nat:"フィリピン", date:"2026/5/20"}),
      worker({id:"w15", name:"RAHMAWATI INTAN", nat:"インドネシア", date:"2026/5/21"}),
      worker({id:"w16", name:"THANT ZIN", nat:"ミャンマー", date:"2026/5/21"}),
      worker({id:"w17", name:"DO VAN NAM", nat:"ベトナム", date:"2026/5/22",
        problems:{"1-2":"夜勤明けの休憩室の換気について本人より要望あり。施設へ改善を依頼中。"}}),
      worker({id:"w18", name:"VILLANUEVA ROSE", nat:"フィリピン", date:"2026/5/22"}),
      worker({id:"w19", name:"PUSPITA AYU", nat:"インドネシア", date:"2026/5/23"}),
      worker({id:"w20", name:"KYAW SWAR", nat:"ミャンマー", date:"2026/5/23"}),
      worker({id:"w21", name:"BUI THI LAN", nat:"ベトナム", date:"2026/5/26"}),
      worker({id:"w22", name:"CRUZ MARK", nat:"フィリピン", date:"2026/5/26"}),
      worker({id:"w23", name:"WATI SRI", nat:"インドネシア", date:"2026/5/27"}),
    ]
  },
];
 
/* ============ ステータス判定 ============ */
function statusOf(w){
  if(w.violation) return "bad";
  if(Object.keys(w.problems).length) return "warn";
  return "ok";
}
const LABEL={ok:"問題なし",warn:"問題あり",bad:"法令違反"};
 
/* ============ サマリー ============ */
function renderSummary(){
  let fac=DATA.length, total=0, warn=0, bad=0;
  DATA.forEach(f=>f.workers.forEach(w=>{
    total++; const s=statusOf(w);
    if(s==="bad"){bad++;warn++;} else if(s==="warn"){warn++;}
  }));
  document.getElementById("summary").innerHTML=`
    <div class="stat"><div class="label">対象施設</div><div class="num">${fac}<small> 施設</small></div></div>
    <div class="stat"><div class="label">面談対象者（特定技能1号）</div><div class="num">${total}<small> 名</small></div></div>
    <div class="stat t-warn"><div class="label">問題あり</div><div class="num">${warn}<small> 名</small></div></div>
    <div class="stat t-bad"><div class="label">法令違反</div><div class="num">${bad}<small> 名</small></div></div>`;
}
 
/* ============ 施設リスト ============ */
let activeFilter="all";
function facilityMatches(f){
  if(activeFilter==="all") return true;
  return f.workers.some(w=>statusOf(w)===activeFilter);
}
function renderFacilities(){
  const wrap=document.getElementById("facilities");
  const shown=DATA.filter(facilityMatches);
  if(!shown.length){wrap.innerHTML='<div class="empty">該当する施設はありません。</div>';return;}
  wrap.innerHTML=shown.map(f=>{
    const total=f.workers.length;
    const bad=f.workers.filter(w=>statusOf(w)==="bad").length;
    const warn=f.workers.filter(w=>statusOf(w)==="warn").length;
    const strip=f.workers.map(w=>`<span class="s-${statusOf(w)}"></span>`).join("");
    const rows=f.workers.map(w=>{
      const s=statusOf(w);
      const probCount=Object.keys(w.problems).length;
      const probTxt = s==="bad" ? "法令違反 1件"
        : probCount ? probCount+"件" : '<span class="dash">—</span>';
      return `<tr onclick="openModal('${f.id}','${w.id}')">
        <td class="w-name" data-l="氏名">${w.name}<span class="nat">${w.nat}</span></td>
        <td data-l="面談日">${w.date}</td>
        <td class="col-c" data-l="問題">${probTxt}</td>
        <td class="col-c" data-l="判定"><span class="badge ${s}">${LABEL[s]}</span></td>
        <td class="col-c"><span class="view-link">面談票を見る ›</span></td>
      </tr>`;
    }).join("");
    return `<div class="facility" id="fac-${f.id}">
      <div class="strip">${strip}</div>
      <div class="fac-head" onclick="toggleFac('${f.id}')">
        <div class="fac-title-wrap">
          <div class="fac-name">${f.name}</div>
          <div class="fac-meta">${f.area}　｜　所属機関：${f.org}</div>
        </div>
        <div class="fac-right">
          <div class="fac-counts">
            <div class="c"><b>${total}</b>対象者</div>
            <div class="c warn"><b>${warn}</b>問題あり</div>
            <div class="c bad"><b>${bad}</b>法令違反</div>
          </div>
          <div class="toggle">▾</div>
        </div>
      </div>
      <div class="fac-body">
        <table class="workers">
          <thead><tr>
            <th>氏名</th><th>面談日</th><th class="col-c">問題</th><th class="col-c">判定</th><th></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  }).join("");
}
function toggleFac(id){document.getElementById("fac-"+id).classList.toggle("open");}
 
/* ============ フィルタ ============ */
document.getElementById("filters").addEventListener("click",e=>{
  const b=e.target.closest(".chip-btn"); if(!b)return;
  document.querySelectorAll(".chip-btn").forEach(x=>x.classList.remove("active"));
  b.classList.add("active"); activeFilter=b.dataset.f; renderFacilities();
});
 
/* ============ 面談票モーダル ============ */
function openModal(fid,wid){
  const f=DATA.find(x=>x.id===fid);
  const w=f.workers.find(x=>x.id===wid);
  const s=statusOf(w);
 
  // 面談結果テーブル
  let resultRows="";
  ITEMS.forEach((cat,ci)=>{
    cat.list.forEach((item,ii)=>{
      const key=ci+"-"+ii;
      const has=w.problems[key];
      resultRows+=`<tr>
        ${ii===0?`<td class="cat-cell" rowspan="${cat.list.length}">${cat.cat}</td>`:""}
        <td>${item}</td>
        <td class="yn ${has?"has":"no"}">${has?"有":"無"}</td>
        <td class="pnote">${has||""}</td>
      </tr>`;
    });
  });
 
  // 法令違反対応
  let violationHTML="";
  if(w.violation){
    const v=w.violation;
    violationHTML=`
    <div class="sec-label"><span class="sec-num">4</span>法令違反等への対応</div>
    <div class="violation">
      <div class="vh">⑥ 法令違反等の有無：有り</div>
      <div class="vbody">
        <div class="vrow"><div class="vk">①発生年月日</div><div class="vv">${v.occurred}</div></div>
        <div class="vrow"><div class="vk">②違反事実の内容</div><div class="vv">${v.detail}</div></div>
        <div class="vrow"><div class="vk">③対応結果</div><div class="vv">
          <b>ア　1号特定技能外国人への対応</b>
          <ul>${v.a.map(x=>`<li class="done">☑ ${x}</li>`).join("")}</ul>
          <b style="display:block;margin-top:8px;">イ　特定技能所属機関への対応</b>
          <ul>
            <li>(ア) 責任者への通知：<span class="done">${v.iNotice.done?"☑ 通知済み":"未通知"}</span>（${v.iNotice.date}／相手方：${v.iNotice.to}）</li>
            <li>(イ) 出入国在留管理庁への届出の案内：<span class="done">☑ ${v.iImmig}</span></li>
          </ul>
          <b style="display:block;margin-top:8px;">ウ　関係行政機関への対応</b>
          <ul><li><span class="done">☑ 通報済み</span>（${v.c.date}／通報先：${v.c.office}）</li></ul>
        </div></div>
      </div>
    </div>`;
  }
 
  document.getElementById("modal").innerHTML=`
    <div class="modal-head">
      <div>
        <div class="mh-form">参考様式第5-5号</div>
        <div class="mh-title" id="mTitle">定期面談報告書</div>
        <div class="mh-sub">${f.name}　｜　判定：${LABEL[s]}</div>
      </div>
      <button class="closex" onclick="closeModal()" aria-label="閉じる">×</button>
    </div>
    <div class="modal-body">
      <div class="sec-label"><span class="sec-num">1</span>面談対象者</div>
      <div class="kv">
        <div class="k">特定技能外国人の氏名</div><div class="v">${w.name}　<span style="color:var(--ink-mute);font-size:12px;">${w.nat}</span></div>
        <div class="k">特定技能所属機関</div><div class="v">${f.org}</div>
        <div class="k">面談日</div><div class="v">${w.date}</div>
      </div>
 
      <div class="sec-label"><span class="sec-num">2</span>面談対応者</div>
      <div class="kv">
        <div class="k">対応者の氏名</div><div class="v">${w.respondent}</div>
        <div class="k">役職</div><div class="v">${w.role}</div>
      </div>
 
      <div class="sec-label"><span class="sec-num">3</span>面談結果</div>
      <table class="result">
        <thead><tr><th style="width:90px;">面談事項</th><th>面談内容</th><th style="width:46px;text-align:center;">問題</th><th style="width:230px;">問題の内容</th></tr></thead>
        <tbody>${resultRows}</tbody>
      </table>
 
      ${violationHTML}
 
      <div class="modal-foot">
        <span>作成年月日：${w.madeOn||"—"}</span>
        <span>面談実施者：${w.respondent}</span>
      </div>
    </div>`;
  document.getElementById("overlay").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeModal(){
  document.getElementById("overlay").classList.remove("show");
  document.body.style.overflow="";
}
document.getElementById("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});
 
/* ============ 初期描画 ============ */
renderSummary();
renderFacilities();
// 最初の施設を開いておく
const first=DATA[0]; if(first) document.getElementById("fac-"+first.id).classList.add("open");
</script>
</body>
</html>
