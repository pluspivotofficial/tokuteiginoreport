<style>
  :root{
    --navy:#1F3864; --navy-soft:#3a517f; --ink:#21262e; --ink-mute:#5b6573;
    --line:#dfe3ea; --line-soft:#eceff4; --paper:#f6f7f9; --white:#fff;
    --ok:#3f7a6d; --ok-bg:#eaf2ef; --warn:#b5740c; --warn-bg:#fbf2e2;
    --bad:#b42318; --bad-bg:#fbeae8; --shadow:0 1px 2px rgba(31,56,100,.06),0 8px 24px rgba(31,56,100,.06);
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{margin:0;font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;overflow-x:hidden;
    color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.7;}
  .serif{font-family:"Noto Serif JP","Hiragino Mincho ProN",serif;}
  header.masthead{background:var(--navy);color:#eef2f9;padding:22px clamp(16px,4vw,44px) 20px;border-bottom:3px solid #14233f;}
  .masthead .eyebrow{font-size:11px;letter-spacing:.26em;color:#aebcd6;text-transform:uppercase;margin:0 0 7px;}
  .masthead h1{font-family:"Noto Serif JP",serif;font-weight:600;font-size:clamp(19px,3.2vw,27px);margin:0;letter-spacing:.04em;}
  .masthead .sub{color:#c5d0e6;font-size:13px;margin-top:6px;}
  .masthead .formref{display:inline-block;margin-top:12px;font-size:11px;color:#aebcd6;border:1px solid #3a4f78;border-radius:4px;padding:3px 9px;letter-spacing:.05em;}

  .summary{max-width:1180px;margin:-16px auto 0;padding:0 clamp(12px,3vw,24px);display:grid;gap:11px;}
  .summary.c4{grid-template-columns:repeat(4,1fr);}
  .summary.c5{grid-template-columns:repeat(5,1fr);}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:13px 15px;box-shadow:var(--shadow);}
  .stat .label{font-size:11.5px;color:var(--ink-mute);}
  .stat .num{font-family:"Noto Serif JP",serif;font-weight:700;font-size:26px;line-height:1.1;margin-top:2px;}
  .stat .num small{font-size:12px;font-weight:500;color:var(--ink-mute);font-family:inherit;}
  .stat.t-bad .num{color:var(--bad);} .stat.t-warn .num{color:var(--warn);} .stat.t-over .num{color:var(--bad);}

  main{max-width:1180px;margin:0 auto;padding:24px clamp(12px,3vw,24px) 60px;}
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 14px;}
  .chip-btn{border:1px solid var(--line);background:var(--white);color:var(--ink-mute);font-family:inherit;font-size:12.5px;border-radius:999px;padding:6px 13px;cursor:pointer;transition:.15s;}
  .chip-btn:hover{border-color:var(--navy-soft);color:var(--navy);}
  .chip-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .hint{margin-left:auto;font-size:11.5px;color:var(--ink-mute);}

  .section-title{font-family:"Noto Serif JP",serif;font-weight:600;color:var(--navy);font-size:15px;margin:26px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title::before{content:"";width:4px;height:16px;background:var(--navy);border-radius:2px;}

  .facility{background:var(--white);border:1px solid var(--line);border-radius:12px;margin-bottom:15px;box-shadow:var(--shadow);overflow:hidden;}
  .strip{display:flex;height:6px;width:100%;} .strip span{flex:1;min-width:3px;}
  .strip span.s-ok{background:var(--ok);} .strip span.s-warn{background:var(--warn);} .strip span.s-bad{background:var(--bad);} .strip span.s-none{background:#cbd2dd;}
  .fac-head{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:15px 18px;cursor:pointer;border-left:5px solid var(--navy);}
  .fac-head:hover{background:#fafbfd;}
  .fac-name{font-family:"Noto Serif JP",serif;font-weight:600;font-size:17px;color:var(--navy);}
  .fac-meta{font-size:12px;color:var(--ink-mute);margin-top:3px;}
  .fac-right{display:flex;align-items:center;gap:16px;}
  .fac-counts{display:flex;gap:13px;text-align:center;}
  .fac-counts .c{font-size:11px;color:var(--ink-mute);line-height:1.3;}
  .fac-counts .c b{display:block;font-family:"Noto Serif JP",serif;font-size:18px;color:var(--ink);}
  .fac-counts .c.bad b{color:var(--bad);} .fac-counts .c.warn b{color:var(--warn);} .fac-counts .c.over b{color:var(--bad);}
  .toggle{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--navy);font-size:13px;transition:.2s;flex:none;}
  .facility.open .toggle{transform:rotate(180deg);background:var(--navy);color:#fff;border-color:var(--navy);}
  .fac-body{display:none;border-top:1px solid var(--line-soft);} .facility.open .fac-body{display:block;}

  table.workers{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.workers thead th{text-align:left;font-weight:500;font-size:11.5px;color:var(--ink-mute);padding:10px 14px;border-bottom:1px solid var(--line);background:#fafbfd;}
  table.workers tbody td{padding:11px 14px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  table.workers tbody tr:last-child td{border-bottom:none;}
  table.workers tbody tr{cursor:pointer;transition:.12s;} table.workers tbody tr:hover{background:#f7f9fc;}
  .w-name{font-weight:500;} .w-name .nat{font-size:11px;color:var(--ink-mute);font-weight:400;margin-left:6px;}
  .col-c{text-align:center;} .view-link{color:var(--navy);font-size:12px;font-weight:500;white-space:nowrap;}
  .badge{display:inline-block;font-size:11.5px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap;}
  .badge.ok{background:var(--ok-bg);color:var(--ok);} .badge.warn{background:var(--warn-bg);color:var(--warn);}
  .badge.bad{background:var(--bad-bg);color:var(--bad);} .badge.none{background:#eef1f5;color:var(--ink-mute);}
  .due{font-size:12px;} .due.overdue{color:var(--bad);font-weight:600;} .due.soon{color:var(--warn);font-weight:600;} .due.ok{color:var(--ink-mute);} .dash{color:#c3cad6;}

  /* アラート */
  .alert-card{background:var(--white);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:14px 16px;margin-bottom:15px;box-shadow:var(--shadow);}
  .alert-card.soon{border-left-color:var(--warn);}
  .alert-card h3{margin:0 0 8px;font-size:13px;color:var(--ink);}
  .alert-row{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0;border-top:1px solid var(--line-soft);}
  .alert-row:first-of-type{border-top:none;}

  /* モーダル */
  .overlay{position:fixed;inset:0;background:rgba(20,30,52,.55);display:none;z-index:50;padding:18px;overflow-y:auto;}
  .overlay.show{display:block;}
  .modal{background:var(--white);max-width:840px;margin:22px auto;border-radius:12px;box-shadow:0 20px 60px rgba(10,20,40,.35);overflow:hidden;}
  .modal-head{background:var(--navy);color:#eef2f9;padding:16px 22px;display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .modal-head .mh-form{font-size:11px;color:#aebcd6;letter-spacing:.18em;}
  .modal-head .mh-title{font-family:"Noto Serif JP",serif;font-size:18px;font-weight:600;margin-top:2px;}
  .modal-head .mh-sub{font-size:12px;color:#c5d0e6;margin-top:4px;}
  .closex{background:none;border:none;color:#cdd8ec;font-size:24px;cursor:pointer;line-height:1;padding:2px 8px;border-radius:6px;}
  .closex:hover{background:rgba(255,255,255,.12);}
  .mh-actions{display:flex;align-items:center;gap:8px;flex:none;}
  .pdfbtn{background:#fff;color:var(--navy);border:none;border-radius:7px;font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;cursor:pointer;white-space:nowrap;}
  .pdfbtn:hover{background:#eef2f9;} .pdfbtn:disabled{opacity:.6;cursor:default;}
  .modal-body{padding:20px 22px 26px;}
  .sec-label{font-family:"Noto Serif JP",serif;font-weight:600;color:var(--navy);font-size:14px;margin:22px 0 9px;padding-bottom:6px;border-bottom:2px solid var(--navy);display:flex;align-items:center;gap:8px;}
  .sec-label:first-child{margin-top:0;}
  .sec-num{background:var(--navy);color:#fff;font-size:11px;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;}
  .kv{display:grid;grid-template-columns:140px 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:13px;}
  .kv .k{background:#f4f6fa;padding:9px 12px;border-bottom:1px solid var(--line-soft);color:var(--ink-mute);font-size:12px;}
  .kv .v{padding:9px 12px;border-bottom:1px solid var(--line-soft);}
  .kv .k:last-of-type,.kv .v:last-of-type{border-bottom:none;}
  table.result{width:100%;border-collapse:collapse;font-size:12.5px;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  table.result th{background:#f4f6fa;color:var(--ink-mute);font-weight:500;font-size:11px;padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);}
  table.result td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top;} table.result tr:last-child td{border-bottom:none;}
  .cat-cell{font-weight:500;color:var(--navy);white-space:nowrap;background:#fbfcfe;border-right:1px solid var(--line-soft);}
  .yn{font-weight:700;text-align:center;white-space:nowrap;} .yn.has{color:var(--bad);} .yn.no{color:var(--ok);} .pnote{color:var(--bad);font-size:12px;}
  .violation{border:1px solid var(--bad);border-radius:8px;overflow:hidden;}
  .violation .vh{background:var(--bad-bg);color:var(--bad);font-weight:600;font-size:12.5px;padding:8px 12px;border-bottom:1px solid #f0cfca;}
  .vrow{display:grid;grid-template-columns:150px 1fr;font-size:12.5px;border-bottom:1px solid var(--line-soft);} .vrow:last-child{border-bottom:none;}
  .vrow .vk{padding:9px 12px;color:var(--ink-mute);background:#fcf6f5;font-size:12px;} .vrow .vv{padding:9px 12px;}
  .vv ul{margin:0;padding-left:18px;} .vv .done{color:var(--ok);font-weight:600;}
  .history{margin-top:18px;} .history h4{font-size:12px;color:var(--ink-mute);margin:0 0 6px;font-weight:500;}
  .hrow{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 10px;border:1px solid var(--line-soft);border-radius:6px;margin-bottom:5px;}
  .modal-foot{display:flex;justify-content:space-between;gap:16px;font-size:12px;color:var(--ink-mute);margin-top:18px;padding-top:12px;border-top:1px solid var(--line);}
  .empty{padding:40px;text-align:center;color:var(--ink-mute);font-size:13px;}
  .gen{font-size:11px;color:var(--ink-mute);text-align:right;margin-top:18px;}

  /* フォーム */
  .panel{background:var(--white);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px 20px;margin-bottom:15px;}
  .panel h3{font-family:"Noto Serif JP",serif;font-size:15px;color:var(--navy);margin:0 0 14px;}
  .field{margin-bottom:12px;} .field label{display:block;font-size:12px;color:var(--ink-mute);margin-bottom:4px;}
  .field input,.field select,.field textarea{width:100%;font-family:inherit;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);}
  .field textarea{min-height:54px;resize:vertical;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .btn{background:var(--navy);color:#fff;border:none;font-family:inherit;font-size:13.5px;font-weight:500;padding:10px 20px;border-radius:8px;cursor:pointer;transition:.15s;}
  .btn:hover{background:#16294b;} .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid var(--line);}
  .btn.tiny{padding:5px 11px;font-size:11.5px;}
  .item-check{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line-soft);font-size:12.5px;}
  .item-check:first-child{border-top:none;} .item-check input[type=checkbox]{width:auto;flex:none;margin-top:3px;}
  .item-check .ic-note{flex:1;} .item-check .ic-note input{margin-top:5px;}
  .form-msg{font-size:12.5px;margin-top:10px;} .form-msg.ok{color:var(--ok);} .form-msg.err{color:var(--bad);}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;}
  .hidden{display:none!important;}
  details.viobox{border:1px solid var(--bad);border-radius:8px;padding:10px 12px;background:#fdf6f5;margin-top:6px;}
  details.viobox summary{color:var(--bad);font-weight:600;font-size:12.5px;cursor:pointer;}

  *:focus-visible{outline:2px solid var(--navy-soft);outline-offset:2px;border-radius:4px;}
  @media (max-width:760px){
    .summary.c4,.summary.c5{grid-template-columns:1fr 1fr;}
    .fac-head{grid-template-columns:1fr;} .fac-right{justify-content:space-between;}
    table.workers thead{display:none;}
    table.workers tbody td{display:block;padding:4px 14px;border:none;}
    table.workers tbody tr{display:block;padding:10px 0;border-bottom:1px solid var(--line-soft);}
    td[data-l]::before{content:attr(data-l);font-size:11px;color:var(--ink-mute);margin-right:8px;}
    .kv,.vrow{grid-template-columns:1fr;} .grid2{grid-template-columns:1fr;}
    table.result th,table.result td{width:auto!important;font-size:11.5px;padding:6px 7px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
