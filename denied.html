<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<?!= include('styles'); ?>
<style>
  .gate{max-width:440px;margin:14vh auto 0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:30px 28px;text-align:center;}
  .gate .mark{font-family:"Noto Serif JP",serif;color:var(--navy);font-size:18px;font-weight:600;margin-bottom:6px;}
  .gate p{font-size:13.5px;color:var(--ink-mute);margin:0 0 16px;}
  .gate input{width:140px;text-align:center;font-size:20px;letter-spacing:.4em;padding:10px;border:1px solid var(--line);border-radius:8px;}
  .gate .err{color:var(--bad);font-size:12.5px;margin-top:8px;}
</style>
</head>
<body>
  <div class="gate">
    <div class="mark">特定技能 定期面談レポート</div>
    <? if (showPin) { ?>
      <p>このレポートはPINで保護されています。<br>4桁のPINを入力してください。</p>
      <input id="pin" inputmode="numeric" maxlength="4" autofocus>
      <? if (bad) { ?><div class="err">PINが正しくありません。</div><? } ?>
      <div style="margin-top:16px;"><button class="btn" onclick="go()">表示する</button></div>
      <script>
        var FID=<?= JSON.stringify(fid) ?>, TOKEN=<?= JSON.stringify(token) ?>;
        var base=window.location.href.split('?')[0];
        function go(){var v=document.getElementById('pin').value;
          window.location.href=base+'?fid='+encodeURIComponent(FID)+'&token='+encodeURIComponent(TOKEN)+'&pin='+encodeURIComponent(v);}
        document.getElementById('pin').addEventListener('keydown',function(e){if(e.key==='Enter')go();});
      </script>
    <? } else { ?>
      <p><?= message ?></p>
    <? } ?>
  </div>
</body>
</html>
